<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>列下イベント — 見せ方案</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #463f70;
      --font: "Zen Maru Gothic", Meiryo, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      font-weight: 700;
      background: #3d3758;
      color: #703a13;
      padding: 1.25rem;
    }
    h1 { color: #f5cf6f; font-size: 1rem; margin: 0 0 0.5rem; }
    .note { color: #ddd8ef; font-size: 0.78rem; margin: 0 0 1rem; line-height: 1.5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .card {
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 10px;
      padding: 0.75rem;
    }
    .card h2 {
      margin: 0 0 0.35rem;
      font-size: 0.82rem;
      color: var(--ink);
    }
    .card p {
      margin: 0 0 0.65rem;
      font-size: 0.68rem;
      color: #625d7d;
      line-height: 1.4;
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
      max-width: 9.5rem;
    }
    .pick { outline: 2px solid #ff3276; outline-offset: 2px; }

    /* 現行（崩れる例） */
    .old {
      display: block; width: 100%; text-align: left; font: inherit;
      font-size: 0.68rem; font-weight: 700; line-height: 1.35;
      padding: 0.3rem 0.35rem; border-radius: 5px; border: 1px solid #e9b84a;
      background: linear-gradient(180deg, #fff6d6, #ffe29a); color: #5a3d00; cursor: default;
    }
    .old .more { display: block; font-size: 0.58rem; color: #8a6a20; margin-top: 0.1rem; }
    .badge {
      display: inline-flex; min-width: 1.35rem; height: 1.15rem; padding: 0 0.3rem;
      border-radius: 4px; font-size: 0.58rem; font-weight: 900; margin-right: 0.28rem;
      background: linear-gradient(90deg, #e9c95f, #e29403); color: #5a3d00;
    }

    /* 案A: 1行＋色バー（採用。金のみ最大2行） */
    .a {
      display: flex; align-items: center; gap: 0.35rem; height: 1.7rem;
      padding: 0 0.35rem 0 0; border-radius: 5px; border: 1px solid #e9b84a;
      background: linear-gradient(180deg, #fff6d6, #ffe29a); color: #5a3d00;
      font: inherit; font-size: 0.68rem; font-weight: 700; overflow: hidden; cursor: default;
    }
    .a.white { background: #f7f5fa; border-color: #d4cfe0; color: #4a4560; }
    .a.auto { background: #f7f4ff; border-color: #d4c4f0; color: #4a2d7a; }
    .a.gold2 {
      height: auto; min-height: 1.7rem; max-height: 3.05rem;
      align-items: stretch; padding: 0.22rem 0.35rem 0.22rem 0;
    }
    .a .bar { flex: 0 0 4px; align-self: stretch; background: linear-gradient(180deg, #f0d060, #e29403); }
    .a.white .bar { background: #b8b4c8; }
    .a.auto .bar { background: #9b7ad4; }
    .a .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .a.gold2 .name {
      white-space: normal; display: -webkit-box; -webkit-box-orient: vertical;
      -webkit-line-clamp: 2; line-clamp: 2; align-self: center; line-height: 1.2;
    }
    .a .meta { flex: 0 0 auto; font-size: 0.58rem; font-weight: 900; opacity: 0.85; align-self: center; }

    /* 案B: 色ベタ背景のみ・メタなし */
    .b {
      height: 1.7rem; padding: 0 0.45rem; border-radius: 5px; border: 1px solid #e9b84a;
      background: linear-gradient(180deg, #fff6d6, #ffe29a); color: #5a3d00;
      font: inherit; font-size: 0.68rem; font-weight: 800;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.7rem; cursor: default;
    }
  </style>
</head>
<body>
  <h1>列下イベント — 見せ方案</h1>
  <p class="note">狭いサポカ列幅を想定。採用: 案A＋金スキル名のみ最大2行（モーダルなしで選中確認）。</p>
  <div class="grid">
    <section class="card">
      <h2>現行（問題）</h2>
      <p>バッジ＋2行メタで列が伸びる</p>
      <div class="col">
        <div class="old"><span class="badge">金</span>ノンストップガール<span class="more">全3択 · タップで詳細</span></div>
        <div class="old" style="background:#f7f5fa;border-color:#d4cfe0"><span class="badge" style="background:#e8e8f0;color:#4a4a66;border:1px solid #b8b8c8">白</span>ペースアップ<span class="more">全2択 · タップで詳細</span></div>
      </div>
    </section>
    <section class="card pick">
      <h2>案A（採用）</h2>
      <p>色バー＋名前。白/自動は1行、金は最大2行</p>
      <div class="col">
        <div class="a gold2"><span class="bar"></span><span class="name">右回りコーナー〇（やや長い金スキル名の例）</span><span class="meta">3</span></div>
        <div class="a white"><span class="bar"></span><span class="name">ペースアップ</span><span class="meta">2</span></div>
        <div class="a auto"><span class="bar"></span><span class="name">全身全霊</span><span class="meta">自動</span></div>
      </div>
    </section>
    <section class="card">
      <h2>案B</h2>
      <p>メタ無し・色面だけ。情報は少ない</p>
      <div class="col">
        <div class="b">ノンストップガール</div>
        <div class="b" style="background:#f7f5fa;border-color:#d4cfe0;color:#4a4560">ペースアップ</div>
      </div>
    </section>
  </div>
</body>
</html>
